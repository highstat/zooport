[package]
name = "zooport"
version = "0.1.0"
edition = "2021"
description = "A high-performance terminal port manager with instant Cloudflare tunnels"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sprensis/zooport"
homepage = "https://github.com/sprensis/zooport"
keywords = ["tui", "ports", "terminal", "process-manager", "cloudflare"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "zooport"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
listeners = "0.6"
sysinfo = "0.38"
tokio = { version = "1", features = ["full"] }
arboard = "3"
qrcode = "0.14"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
